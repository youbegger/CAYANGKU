<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Semangat Untuk Kamu</title>

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Sacramento&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      height:100vh;
      overflow:hidden;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#ffd6e0,#ffe5ec,#fff0f3);
      font-family:'Poppins',sans-serif;
      position:relative;
    }

    /* Background blur */
    .blur{
      position:absolute;
      border-radius:50%;
      filter:blur(100px);
      opacity:.5;
    }

    .blur1{
      width:320px;
      height:320px;
      background:#ff8fab;
      top:-100px;
      left:-100px;
    }

    .blur2{
      width:260px;
      height:260px;
      background:#ffc2d1;
      bottom:-80px;
      right:-80px;
    }

    /* Flamingo animation */
    .flamingo{
      position:absolute;
      font-size:70px;
      top:15%;
      left:-20%;
      animation:fly 18s linear infinite;
      z-index:1;
      filter:drop-shadow(0 5px 10px rgba(0,0,0,0.15));
    }

    .flamingo2{
      top:70%;
      animation-duration:22s;
      font-size:55px;
      opacity:0.8;
    }

    @keyframes fly{
      0%{
        transform:translateX(0) translateY(0) rotate(-5deg);
      }

      25%{
        transform:translateX(35vw) translateY(-25px) rotate(3deg);
      }

      50%{
        transform:translateX(70vw) translateY(10px) rotate(-3deg);
      }

      100%{
        transform:translateX(140vw) translateY(-20px) rotate(5deg);
      }
    }

    /* Card */
    .card{
      width:390px;
      padding:40px 35px;
      border-radius:30px;
      background:rgba(255,255,255,0.22);
      backdrop-filter:blur(16px);
      border:1px solid rgba(255,255,255,0.4);
      box-shadow:0 10px 40px rgba(0,0,0,0.15);
      text-align:center;
      z-index:2;
      animation:fade 1.5s ease;
    }

    .heart{
      font-size:55px;
      animation:heartbeat 1.5s infinite;
    }

    h1{
      margin-top:10px;
      font-size:45px;
      color:#ff4d6d;
      font-family:'Sacramento',cursive;
    }

    .line{
      width:80px;
      height:3px;
      background:#ff8fab;
      margin:15px auto 25px;
      border-radius:10px;
    }

    p{
      color:#444;
      line-height:1.9;
      font-size:15px;
      font-weight:300;
    }

    button{
      margin-top:30px;
      padding:13px 30px;
      border:none;
      border-radius:50px;
      background:linear-gradient(135deg,#ff758f,#ff4d6d);
      color:white;
      cursor:pointer;
      font-size:15px;
      transition:.4s;
      box-shadow:0 5px 15px rgba(255,77,109,.4);
    }

    button:hover{
      transform:translateY(-3px) scale(1.03);
      box-shadow:0 10px 25px rgba(255,77,109,.5);
    }

    /* Floating hearts */
    .floating-heart{
      position:absolute;
      color:white;
      font-size:20px;
      animation:float 10s linear infinite;
      opacity:.7;
    }

    @keyframes float{
      0%{
        transform:translateY(100vh) scale(.5);
      }
      100%{
        transform:translateY(-120vh) scale(1.2);
      }
    }

    @keyframes heartbeat{
      0%{transform:scale(1);}
      25%{transform:scale(1.15);}
      50%{transform:scale(1);}
      75%{transform:scale(1.15);}
      100%{transform:scale(1);}
    }

    @keyframes fade{
      from{
        opacity:0;
        transform:translateY(40px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

  </style>
</head>

<body>

  <!-- Blur -->
  <div class="blur blur1"></div>
  <div class="blur blur2"></div>

  <!-- Flamingo -->
  <div class="flamingo">🦩</div>
  <div class="flamingo flamingo2">🦩</div>

  <!-- Floating hearts -->
  <div class="floating-heart" style="left:10%; animation-duration:8s;">❤</div>
  <div class="floating-heart" style="left:25%; animation-duration:12s;">❤</div>
  <div class="floating-heart" style="left:45%; animation-duration:10s;">❤</div>
  <div class="floating-heart" style="left:70%; animation-duration:14s;">❤</div>
  <div class="floating-heart" style="left:90%; animation-duration:9s;">❤</div>

  <!-- Card -->
  <div class="card">

    <div class="heart">💖</div>

    <h1>Semangat Ya sayangku</h1>

    <div class="line"></div>

    <p id="text">
      halo pacarku Adel Aku tahu akhir-akhir ini mungkin banyak hal yang bikin kamu lelah...  
      tapi tolong jangan menyerah yaa 🌷<br><br>

      Kamu hebat, kuat, dan selalu berhasil melewati semuanya.  
      Aku selalu percaya sama kamu dan akan selalu ada buat kamu 💕
    </p>

    <button onclick="ubahPesan()">
      LANJUT ✨
    </button>

  </div>

  <script>
    function ubahPesan(){
      document.getElementById("text").innerHTML = `
        Sayang... 💖<br><br>

        Kalau dunia terasa berat, istirahat sebentar yaa.jangan sungkan buat ngeluh dan minta bantuan sama aku 
        ILOVE YOU SOMUCH SAYANGKUU CINTAKUUUU 🌸<br><br>

        SEMANGAT TERUS YA SAYANG 🦩💕   

      JANGAN LUPA PS 5 NYA YA HEHEHE,BERCANDAA SENGGG
      `;
    }
  </script>

</body>
</html>
